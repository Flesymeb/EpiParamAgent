[project]
name = "metaagent-epi"
version = "0.2.0"
description = "Epidemiology meta-analysis agent: unified CLI for screening, coding, and PubMed workflows"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
]

[project.scripts]
metaagent = "cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cli"]

[tool.uv.workspace]
members = [
    "coding_sheet",
    "literature_search",
]