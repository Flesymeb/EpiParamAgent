topic: fatality
disease: covid19

defaults:
  thresholds:
    strong:
      disease_min: 4
      parameter_min: 4
      evidence_min: 3
      population_min: 2
      location_min: 2
    possible:
      disease_min: 3
      parameter_min: 3
      evidence_min: 2
      population_min: 2
      location_min: 2
  policies:
    title_abstract_mode: strict
    title_only_mode: lenient
    full_text_mode: standard
    stage2_evidence_floor: 1
    parameter_scoring_note: |
      - Score 3–4 if the paper directly reports fatality or severity rates (CFR, IFR, hospitalization rate, case severity distribution) computed or estimated from its own real patient or surveillance data.
      - Score 2 if the paper estimates fatality using a model adjustment applied to aggregate counts, or borrows fatality estimates from another study as an input assumption.
      - Score 0–1 if the paper only mentions fatality or severity in the introduction/background without reporting a new estimate.
    fulltext_rescue:
      enabled: true
      when_no_abstract: true

profiles:
  P4:
    project_number: 4
    research_question: What are the fatality and severity outcomes of SARS-CoV-2 infection?
    disease_focus: (COVID-19 OR COVID19 OR SARS-CoV-2 OR SARS-COV-2 OR 2019-nCoV OR coronavirus OR coronavirus disease 2019)
    disease_exclude: none
    # P4 is benchmarked against a review whose inclusion scope explicitly covers
    # both fatality and severity endpoints (including ICU admission and invasive
    # mechanical ventilation). Keep this broader scope aligned with the GT set.
    parameter_focus: (mortality OR fatality OR case fatality rate OR case fatality ratio OR CFR OR infection fatality rate OR infection fatality ratio OR IFR OR death rate OR died OR ICU admission OR intensive care OR intensive care unit OR invasive mechanical ventilation OR mechanical ventilation OR ventilation OR clinical characteristic*)
    parameter_exclude: studies that do not report mortality, fatality, ICU admission, or invasive mechanical ventilation outcomes as quantified endpoints

  P5:
    project_number: 5
    research_question: What seroprevalence or antibody studies can support inference of SARS-CoV-2 infection fatality rates?
    disease_focus: (COVID-19 OR COVID19 OR SARS-CoV-2 OR SARS-COV-2 OR 2019-nCoV OR coronavirus)
    disease_exclude: none
    # Keep the screening scope aligned with the original review query
    # (seroprevalence / antibody evidence), while excluding clearly off-target
    # immunogenicity and assay-development papers.
    parameter_focus: (seroprevalence OR sero-prevalence OR seropositivity OR serological survey OR serosurvey OR seroepidemiolog* OR anti-SARS-CoV-2 antibod* OR antibody prevalence OR antibody survey)
    parameter_exclude: studies that report antibody responses for vaccine efficacy, immunogenicity, assay development, or laboratory validation without population-level seroprevalence or antibody prevalence estimates

  P6:
    project_number: 6
    research_question: What is the mortality or case fatality rate of COVID-19?
    disease_focus: (COVID-19 OR COVID 19 OR COVID-2019 OR 2019-nCoV OR 2019nCoV OR SARS-CoV-2 OR severe acute respiratory syndrome coronavirus 2 OR ((Wuhan AND coronavirus)))
    disease_exclude: none
    parameter_focus: (mortality OR (case AND fatality AND rate) OR case fatality rate OR mortality rate OR death rate)
    parameter_exclude: none

  # P9 excluded from evaluation: only 14 GT papers (2 mislabeled), pool positive rate ~0.7%,
  # metrics too noisy to be informative. Profile kept here for reference only.
