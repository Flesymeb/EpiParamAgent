topic: fatality

defaults:
  thresholds:
    strong:
      disease_min: 4
      parameter_min: 4
      evidence_min: 3
      population_min: 2
      location_min: 2
    possible:
      disease_min: 3
      parameter_min: 3
      evidence_min: 2
      population_min: 2
      location_min: 2
  policies:
    title_abstract_mode: strict
    title_only_mode: lenient
    full_text_mode: standard
    fulltext_rescue:
      enabled: true
      when_no_abstract: true

profiles:
  P4:
    project_number: 4
    research_question: What are the fatality and severity outcomes of SARS-CoV-2 infection?
    disease_focus: (COVID-19 OR COVID19 OR SARS-CoV-2 OR SARS-COV-2 OR 2019-nCoV OR coronavirus OR coronavirus disease 2019)
    disease_exclude: none
    parameter_focus: (mortality OR fatality OR case fatality rate OR CFR OR infection fatality rate OR IFR OR death rate OR died OR ICU admission OR intensive care OR invasive mechanical ventilation OR mechanical ventilation)
    parameter_exclude: studies that do not report mortality, fatality rates, ICU admission, or mechanical ventilation outcomes as quantified endpoints

  P5:
    project_number: 5
    research_question: What are the fatality rates of SARS-CoV-2 inferred from seroprevalence or antibody studies?
    disease_focus: (COVID-19 OR COVID19 OR SARS-CoV-2 OR SARS-COV-2 OR 2019-nCoV OR coronavirus)
    disease_exclude: none
    parameter_focus: (seroprevalence OR sero-prevalence OR seropositivity OR serological survey OR serosurvey OR seroepidemiolog* OR anti-SARS-CoV-2 antibod* OR infection fatality rate OR infection fatality ratio OR IFR OR fatality rate OR case fatality rate OR CFR)
    parameter_exclude: studies that report antibody responses for vaccine efficacy or therapeutic purposes without estimating population-level fatality rates

  P6:
    project_number: 6
    research_question: What is the mortality or case fatality rate of COVID-19?
    disease_focus: (COVID-19 OR COVID 19 OR COVID-2019 OR 2019-nCoV OR 2019nCoV OR SARS-CoV-2 OR severe acute respiratory syndrome coronavirus 2 OR ((Wuhan AND coronavirus)))
    disease_exclude: none
    parameter_focus: (case fatality rate OR case fatality ratio OR CFR OR infection fatality rate OR infection fatality ratio OR IFR OR mortality rate OR death rate OR fatality rate OR COVID-19 mortality OR SARS-CoV-2 mortality)
    parameter_exclude: studies that mention mortality only as a secondary outcome without reporting or estimating a fatality rate

  # P9 excluded from evaluation: only 14 GT papers (2 mislabeled), pool positive rate ~0.7%,
  # metrics too noisy to be informative. Profile kept here for reference only.
