topic: reproduction_number

defaults:
  thresholds:
    strong:
      disease_min: 4
      parameter_min: 4
      evidence_min: 3
      population_min: 2
      location_min: 2
    possible:
      disease_min: 3
      parameter_min: 3
      evidence_min: 2
      population_min: 2
      location_min: 2
  policies:
    title_abstract_mode: strict
    title_only_mode: lenient
    full_text_mode: standard
    fulltext_rescue:
      enabled: true
      when_no_abstract: true

