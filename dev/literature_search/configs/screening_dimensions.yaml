# Multi-Dimensional Screening Criteria for COVID-19 Epidemiology Meta-Analysis
#
# This file defines the 7 evaluation dimensions used to assess paper relevance
# for epidemiological parameter estimation (serial interval, isolation delay, etc.)
#
# Each dimension has:
#   - name: Display name
#   - weight: Importance in overall score (sum to 1.0)
#   - description: Brief explanation
#   - criteria_high: Conditions for HIGH score
#   - criteria_medium: Conditions for MEDIUM score
#   - criteria_low: Conditions for LOW score
#   - criteria_uncertain: When to use UNCERTAIN

dimensions:
  - id: disease_relevance
    name: "Disease and Research Object Relevance"
    weight: 0.20
    description: "Is this paper studying COVID-19 human transmission epidemiology?"
    criteria_high: |
      - Explicitly studies COVID-19 / SARS-CoV-2 in human populations
      - Focuses on transmission dynamics or temporal disease processes
      - Addresses epidemiological parameters (serial interval, R0, generation time, etc.)
    criteria_medium: |
      - Studies COVID-19 but with mixed focus (epidemiology + other aspects)
      - Relevant disease but tangential to transmission parameters
      - Comparative studies including COVID-19 among other diseases
    criteria_low: |
      - Non-COVID disease (e.g., Pneumonia, influenza without COVID context)
      - Focuses solely on virology without epidemiological context
      - Studies comorbidities, risk factors, or clinical outcomes unrelated to transmission timing
      - Focuses on healthcare system burden or policy without parameter estimation
    criteria_uncertain: |
      - Title/abstract unclear about disease focus
      - Insufficient information to determine COVID-19 relevance

  - id: original_data
    name: "Original Empirical Data"
    weight: 0.20
    description: "Does this study provide original empirical data rather than derived/simulated estimates?"
    criteria_high: |
      - Based on original case data (line lists, contact tracing, outbreak investigations)
      - Primary data collection with individual-level observations
      - Clearly reports original parameter estimates with uncertainty
    criteria_medium: |
      - Secondary analysis of publicly available datasets
      - Re-analysis of original data with new methods
      - Combined primary and secondary data sources
    criteria_low: |
      - Pure modeling/simulation studies without empirical validation
      - Parameters derived or borrowed from other studies
      - Review articles, commentaries, or methodology papers with no new data
      - Theoretical framework papers
    criteria_uncertain: |
      - Abstract unclear whether data is original or simulated
      - Cannot determine data source from title/abstract

  - id: population_level
    name: "Study Level and Data Granularity"
    weight: 0.15
    description: "Is this a population-level study that can be pooled in meta-analysis?"
    criteria_high: |
      - Population, cohort, or cluster-level study
      - Multiple cases analyzed to derive distributions (mean, median, SD)
      - Aggregated data suitable for meta-analysis
    criteria_medium: |
      - Small sample size but population-based approach
      - Household or small cluster studies
      - Mixed individual and aggregate reporting
    criteria_low: |
      - Single case report or case series without aggregation
      - Purely descriptive clinical symptom studies of individuals
      - Case reports focused on rare presentations
    criteria_uncertain: |
      - Sample size unclear from abstract
      - Cannot determine if individual vs population level

  - id: parameter_availability
    name: "Target Parameter Availability"
    weight: 0.15
    description: "Are the specific epidemiological parameters of interest reported?"
    criteria_high: |
      - Explicitly reports target parameter (serial interval, isolation delay, etc.)
      - Clear definition of temporal endpoints (onset dates, isolation dates)
      - Provides time window or study period for estimates
      - Reports uncertainty measures (CI, SD, IQR, or range)
    criteria_medium: |
      - Reports related but not exact parameter (e.g., incubation period when seeking serial interval)
      - Parameter mentioned but limited detail on calculation
      - Time intervals reported but definitions imprecise
    criteria_low: |
      - Does not report any temporal interval parameters
      - Study design incompatible with parameter estimation
      - Data incomplete or missing key time points
    criteria_uncertain: |
      - Abstract mentions parameters but unclear which ones
      - Cannot determine from title/abstract if parameters are present

  - id: statistical_usability
    name: "Statistical Usability and Uncertainty"
    weight: 0.10
    description: "Can the effect size be extracted and pooled in meta-analysis?"
    criteria_high: |
      - Reports point estimate (mean/median) AND uncertainty (CI/SD/IQR)
      - Sufficient information to calculate variance or standard error
      - Sample size provided
      - Statistical model clearly described
    criteria_medium: |
      - Reports point estimate with incomplete uncertainty (e.g., range only)
      - Upper/lower bounds allow variance estimation
      - Some statistical detail but missing key components
    criteria_low: |
      - Only point estimates without any uncertainty
      - No sample size or distributional information
      - Data quality issues noted by authors
      - Insufficient detail for meta-analysis inclusion
    criteria_uncertain: |
      - Statistical information unclear from abstract
      - Full text needed to assess extractability

  - id: design_relevance
    name: "Study Design Appropriateness"
    weight: 0.10
    description: "Is the study design appropriate for estimating temporal parameters?"
    criteria_high: |
      - Contact tracing studies with linked case pairs
      - Outbreak or cluster investigations with detailed temporal data
      - Surveillance data analysis with individual-level timing
      - Cohort studies tracking infection events over time
    criteria_medium: |
      - Cross-sectional studies with retrospective timing data
      - Database analyses with limited temporal resolution
      - Studies with timing data but potential recall bias
    criteria_low: |
      - Behavioral response studies (lifestyle, public reaction)
      - Healthcare capacity or system burden analyses
      - Diagnostic tool evaluation or screening programs
      - Treatment or therapeutic intervention studies
      - Genetic or laboratory studies without epidemiological context
    criteria_uncertain: |
      - Study design not clear from title/abstract
      - Methodology description too vague

  - id: parameter_alignment
    name: "Target Parameter Alignment"
    weight: 0.10
    description: "Does the study explicitly aim to estimate the epidemiological parameters we need?"
    criteria_high: |
      - Study objective explicitly states parameter estimation
      - Parameter is primary outcome
      - Methods designed specifically for parameter calculation
    criteria_medium: |
      - Parameter is secondary outcome or reported tangentially
      - Study estimates related parameters that can be converted
      - Parameter mentioned but not main focus
    criteria_low: |
      - Study does not aim to estimate any epidemiological parameters
      - Focus on different research questions (diagnosis, treatment, prevalence)
      - Parameters only mentioned in discussion/comparison
    criteria_uncertain: |
      - Research objectives unclear from abstract
      - Cannot determine parameter alignment without full text

# Aggregation settings
aggregation:
  method: "weighted_sum" # Options: weighted_sum, threshold_rules, priority_ordering

  # Thresholds for recommendation
  thresholds:
    include: 0.70 # Overall score >= 0.70 → INCLUDE
    maybe: 0.40 # 0.40 <= score < 0.70 → MAYBE (manual review)
    exclude: 0.40 # Score < 0.40 → EXCLUDE

  # Critical exclusion rules (override score-based recommendation)
  critical_exclusions:
    - dimension: disease_relevance
      condition: "LOW"
      action: "EXCLUDE"
      reason: "Not relevant to COVID-19 epidemiology"

    - dimension: original_data
      condition: "LOW"
      action: "EXCLUDE"
      reason: "No original empirical data"

# Display settings for exports
export:
  dimension_columns:
    - disease_relevance
    - original_data
    - population_level
    - parameter_availability
    - statistical_usability
    - design_relevance
    - parameter_alignment

  include_rationales: true
  include_confidence: true

  csv_format:
    overall_score_decimals: 2
    include_recommendation: true
