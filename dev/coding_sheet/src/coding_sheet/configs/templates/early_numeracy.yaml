# Early Numeracy → Math Achievement Meta-Analysis
# 早期数感/数学环境 与 后期数学成绩的纵向研究
# Codebook & configuration file

project:
  name: "Early Numeracy to Math Achievement"
  description: "提取早期数感(EN)相关变量与后期数学成绩的纵向相关"
  effect_type: "correlation"

# === 研究问题定义 ===
research_question:
  description: |
    研究问题：早期数感(Early Numeracy)相关变量能否预测后期数学成绩？

    T1 (Early Numeracy) 包括：
    - 儿童的数感能力（counting, number identification, magnitude等）
    - 家庭数学环境（home numeracy environment）
    - 父母/母亲数学支持行为（maternal numerical support）
    - 数学相关的早期经验

    T2 (Math Achievement) 包括：
    - 标准化数学测验（WJ, TEMA, KeyMath等）
    - 学校数学成绩
    - 数学能力评估

    纳入标准：
    - T1 是数感相关变量（儿童能力或环境因素）
    - T2 是数学成绩/能力
    - T1 和 T2 在不同时间点测量

fields:
  # === 论文识别 ===
  - name: study
    label: "Study"
    type: str
    required: true
    prompt: "格式: Author et al., YEAR（如 Casey et al., 2018）"

  - name: year
    label: "Year"
    type: int
    prompt: |
      发表年份（4位数字）

      **来源优先级**：
      1. 如果论文元数据中已提供year字段（从DOI解析），直接使用
      2. 从PDF中查找：标题页、版权声明、页眉页脚
      3. 常见位置：
         - Copyright © 2018
         - Published: January 2018
         - Received: March 2017; Accepted: December 2017 (使用Accepted年份)

      **注意**：如果找不到明确年份，留空（null）

  - name: country
    label: "Country"
    type: str
    prompt: "研究国家（如 United States, China）"

  # === 样本特征 ===
  - name: gender
    label: "Gender"
    type: int
    prompt: |
      男性百分比（数字）
      例如: 45 表示 45% 男性
      如果未报告，根据性别人数计算，或者留空

  - name: sample_size_t1
    label: "Sample Size at T1"
    type: int
    required: true
    prompt: |
      T1时实际完成测量的样本量（不是初始招募数）

      **计算方法（按优先级）：**
      1. 如果 Table 1/Descriptive Statistics 报告了 T1变量的 missing%：
         → Sample_T1 = 初始N × (1 - missing%)
         例：100 recruited, T1 missing 15% → 100 × 0.85 = 85

      2. 如果直接报告了完成人数：
         → 使用该值

      3. 如果只有初始招募数且无missing信息：
         → 使用招募数（但在notes中标注"May include attrition"）

      **重要：优先查找相关 Table 中 T1变量的 "% Missing" 或 "Missing" 列！**

  - name: sample_size_t2
    label: "Sample Size at T2"
    type: int
    required: true
    prompt: |
      T2时实际完成测量的样本量

      **计算方法（按优先级）：**
      1. 如果相关 Table 报告了 T2变量的 missing%：
         → Sample_T2 = 初始N × (1 - missing%)
         例：100 recruited, T2 missing 27% → 100 × 0.73 ≈ 73

      2. 如果报告了从T1到T2的 attrition%：
         → Sample_T2 = Sample_T1 × (1 - attrition%)

      3. 如果直接报告：使用该值

      **重要：T2变量通常有更高的missing rate（纵向流失）**

  - name: n
    label: "n"
    type: float
    required: true
    prompt: |
      用于计算相关的有效成对样本量（pairwise complete cases）

      **计算方法（按优先级）：**

      **优先级1（标准方法）：使用 Sample_T1 和 Sample_T2 的平均值**
      - **所有记录统一使用此方法**
      - n = (Sample_T1 + Sample_T2) / 2
      - 保留1位小数: 例 (119+104)/2 = 111.5
      - **在notes中标注**: "n estimated from Sample_T1 and Sample_T2 average: (119+104)/2=111.5"
      - **即使论文报告了明确的pairwise N，仍使用此方法保持一致性**

      **优先级2（备选）：论文明确报告的pairwise N**
      - 仅当无法确定Sample_T1和Sample_T2时使用
      - 表注中的r(df): "r(97) = .33" → n = 97 + 2 = 99
      - 表格脚注: "Correlations based on n = 95 pairs"
      - **在notes中记录**: "n from pairwise N reported in paper: r(100) → n=102"

      **优先级3（保守估计）：使用纵向追踪的最终样本量**
      - 如论文明确说"61 students completed both waves"
      - 这是保守估计（lower bound）

      **重要**: 
      - **必须优先确定Sample_T1和Sample_T2的值**
      - **n统一使用(Sample_T1 + Sample_T2) / 2计算**
      - 在notes中记录n的计算依据

  # === 时间信息 ===
  - name: age_at_t1
    label: "Age_at_T1"
    type: float
    prompt: |
      T1测量时的平均年龄(岁)

      **转换规则**:
      - 报告月份: 36 months = 3.0 yr, 48 months = 4.0 yr
      - 报告年级: 使用下表转换（美国K-12体系）
      - 报告范围: 取中点
      - 报告季节: preschool fall ≈ 4.0 yr, spring ≈ 4.5 yr

      **年级→年龄转换表（美国体系）**:
      - Pre-K/Preschool: default=4.5 yr
      - Kindergarten (K): winter=5.3, spring=5.7, avg=5.5
      - Grade 1: winter=6.3, spring=6.7, avg=6.5
      - Grade 2: winter=7.3, spring=7.7, avg=7.5
      - Grade 3-12: 依此类推，每年+1

      **如果使用年级转换，必须在notes中记录evidence**
      例: "Age estimated from grade level (kindergarten spring → 5.7 yr)"

  - name: age_at_t2
    label: "Age_at_T2"
    type: float
    prompt: |
      T2测量时的平均年龄(岁)

      **使用与Age_at_T1相同的转换规则**
      - 优先使用论文明确报告的年龄
      - 如果只报告年级，使用年级→年龄转换表
      - 如果有季节信息（winter/spring），使用更精确的值
      - 必须在notes中记录转换依据

  - name: interval
    label: "Interval"
    type: float
    prompt: "T1到T2的时间间隔(年) = Age_at_T2 - Age_at_T1"

  # === T1 早期数感变量 ===
  - name: en_measure
    label: "EN_Measure"
    type: str
    required: true
    prompt: |
      早期数感(Early Numeracy)变量的具体测量，包括：
      - 儿童能力：counting, number identification, magnitude comparison, 
        number line, ANS, subitizing, cardinality等
      - 母亲支持：maternal numerical supports (identify numerals, 
        one-to-one counting, label sets等)
      - 家庭环境：home numeracy activities, math talk等

  # === T2 数学成绩 ===
  - name: math_measure
    label: "Math_Measure"
    type: str
    required: true
    prompt: |
      T2时的数学/数感测量工具

      **包括**:
      1. TEN工具重测（如"TEN Oral Counting", "TEN Number ID"）
      2. 标准化数学测验（如"M-CBM", "WJ Applied Problems", "TEMA-3"）
      3. 教师评价/成绩（如"ACES-M", "Report Card Grade"）

  # === 数据来源标记 ===
  - name: data_source
    label: "Data_Source"
    type: str
    required: true
    prompt: |
      标记相关系数来自论文的哪类表格/数据

      **可选值（必须从以下选择）**:
      - "ten_retest": TEN工具跨时间点重测相关（T1 TEN → T2 TEN）
        例: K winter OC → Grade 1 spring OC
        通常来自标题为"TEN Correlations"的表格

      - "predictive_validity": TEN预测外部标准化测验
        例: K winter OC → Grade 1 M-CBM
        通常来自标题为"Predictive Validity"或"Criterion Measures"的表格

      - "teacher_rating": TEN预测教师评价/成绩
        例: K spring NI → Grade 1 Report Card

      **作用**: 用于后期meta-analysis的moderator分析或敏感性分析

  # === 效应量 ===
  - name: cor
    label: "cor"
    type: float
    range: [-1, 1]
    required: true
    prompt: "T1 EN变量与T2数学成绩的Pearson相关系数"

  # === 依赖关系追踪 ===
  - name: sample_id
    label: "Sample_ID"
    type: str
    required: true
    prompt: |
      唯一标识同一参与者组的ID，用于标记依赖效应量

      **格式：** {first_author_lowercase}_{year}

      **示例：**
      - Casey et al., 2018 → "casey_2018"
      - 同一篇论文的所有记录必须使用相同的sample_id
      - 如果论文有多个独立样本（如不同国家），使用 "casey_2018_us" 和 "casey_2018_cn"

  - name: timepoint_label
    label: "Timepoint_Label"
    type: str
    required: true
    prompt: |
      原始时间点标签（保留论文原文表述）

      **示例：**
      - "4½ years"
      - "First grade"
      - "Pre-K"
      - "36 months"
      - "Kindergarten fall"

      **作用：** 保留原始语境，便于后续筛选特定发展阶段的研究

  - name: developmental_stage
    label: "Developmental_Stage"
    type: str
    required: true
    prompt: |
      标准化的发展阶段分类（用于跨研究比较）

      **可选值（必须从以下选择）：**
      - "Infancy" (0-1 years)
      - "Toddlerhood" (1-3 years)
      - "Preschool" (3-5 years)
      - "Kindergarten" (5-6 years)
      - "Elementary" (6-12 years, Grades 1-6)
      - "Middle School" (12-15 years, Grades 7-9)
      - "High School" (15-18 years, Grades 10-12)

      **判断规则：**
      - 基于 Age_at_T2 或 Timepoint_Label 判断
      - "First grade" → "Elementary"
      - "4½ years" → "Preschool"
      - "Pre-K" → "Preschool"

  - name: is_dependent
    label: "Is_Dependent"
    type: bool
    required: true
    prompt: |
      标记该记录是否与其他记录共享参与者（依赖效应量）

      **判断规则：**
      - 如果同一个 sample_id 有多条记录 → True
      - 只要涉及相同的 T1 测量和相同的参与者组 → True
      - 不同研究/样本 → False

      **典型场景：**
      1. 同一样本的多个时间点（T1 → T2a, T1 → T2b）→ True
      2. 同一样本的多个EN变量预测同一结果 → True
      3. 同一样本的多个Math结果 → True

      **重要性：** 用于元分析时的依赖性矫正（三层模型或RVE）

  - name: notes
    label: "Notes"
    type: str
    prompt: |
      备注信息（关键字段，用于记录提取依据，确保可追溯性）

      **必须记录的信息（按优先级）**:

      1. **相关系数来源** (必填):
         - 格式: "Table X, row: [measure], col: [measure]"
         - 例: "Table 2, K winter OC × Grade 1 winter OC, r=.30"
         - 例: "Table 4, K spring MN × M-CBM winter, r=.52"

      2. **样本量依据** (必填):
         - 如果用明确值: "n from r(df=55) in table note"
         - 如果用baseline平均: "n=(92+78)/2=85.0, baseline average"
         - 如果特殊: "n=38 for ACES-M only (teacher form return rate)"

      3. **年龄转换** (如适用):
         - 例: "Age estimated: K winter=5.3, K spring=5.7, G1 winter=6.3, G1 spring=6.7"
         - 例: "Age from Methods: mean age 5.5 yr at K entry"

      4. **特殊情况** (如适用):
         - 控制变量: "Partial correlation, controlling for SES"
         - 子样本: "Male subsample (n=34)"
         - 缺失值: "ns (not significant), exact r not reported"

      **格式示例**:
      "Table 2, K winter OC × G1 spring OC; n=(92+78)/2=85.0 baseline avg; Age: K winter=5.3, G1 spring=6.7"

extraction_instructions: |
  ## 核心提取原则（Rule D: 全量提取策略）

  **提取目标**: T1(早期数感) → T2(后期数学能力) 的纵向相关系数

  **全量提取 - 不做筛选**:
  - ✅ 提取所有T1时间点（K winter, K spring, 或其他时间点）
  - ✅ 提取所有T2时间点（不筛选"最长"或"最近"）
  - ✅ 提取所有EN×Math组合（包括EN工具重测和外部测验）
  - ✅ 包括不显著的相关（ns标记为缺失或在notes中注明）
  - ✅ 每个 EN变量 × Math测量 × T2时间点 = 一条独立记录

  **为什么全量提取？**
  - 依赖性由后期RVE（Robust Variance Estimation）统计方法处理
  - 不在提取阶段做主观筛选，保留所有信息供后续分析
  - 便于探索不同timepoint、不同outcome type的调节效应

  **依赖标记（用于RVE分析）**:
  - 同一研究所有记录使用相同`sample_id`
  - 所有共享参与者的记录标记`is_dependent=True`

  ---

  ## 相关系数提取 ⚠️ CRITICAL - 按优先级全量提取

  ### 提取优先级和data_source标记

  **优先级1: TEN工具纵向重测（data_source="ten_retest"）**

  **识别特征**:
  - 表格标题: "Tests of Early Numeracy Correlations", "TEN Measures Across Time"
  - 行列都是TEN分测验（OC, NI, QD, MN）的不同时间点
  - 行标签示例: "K OC W"（Kindergarten Oral Counting Winter）
  - 列标签示例: "1 OC S"（First-grade Oral Counting Spring）

  **判断方法**:
  - 行列标签包含时间点缩写（W/S, K/1/2）
  - 行是earlier timepoint，列是later timepoint
  - 测量工具相同（都是TEN或同一EN工具）

  **提取要点**:
  - EN_Measure: 填T1时的测验名称（如"TEN Oral Counting"）
  - Math_Measure: 填T2时的测验名称（如"TEN Oral Counting"）
  - data_source: "ten_retest"
  - 这类相关通常较高（.25-.70），反映数感的纵向稳定性

  **全量提取示例**:
  如果表格覆盖 K winter/spring × Grade 1 winter/spring，应提取：
  - K winter (4 TEN) × G1 winter (4 TEN) = 16条记录
  - K winter (4 TEN) × G1 spring (4 TEN) = 16条记录
  - K spring (4 TEN) × G1 winter (4 TEN) = 16条记录
  - K spring (4 TEN) × G1 spring (4 TEN) = 16条记录
  - **总计64条记录（如果论文分2个表，分别提取）**

  ---

  **优先级2: EN预测标准化数学测验（data_source="predictive_validity"）**

  **识别特征**:
  - 表格标题: "Predictive Validity", "Relationships with Criterion Measures"
  - 行=EN measures (T1), 列=Standardized math tests (T2)
  - 列标签示例: "M-CBM Winter", "WJ Applied Problems", "TEMA-3"

  **判断方法**:
  - 列标签是外部标准化测验名称（非EN工具）
  - 通常在Results的"Predictive Validity"章节

  **提取要点**:
  - EN_Measure: 填T1的EN测验名称
  - Math_Measure: 填T2的标准化测验名称（如"M-CBM", "WJ-III Applied Problems"）
  - data_source: "predictive_validity"
  - 如果有多个T2时间点（如M-CBM winter/spring），全部提取

  ---

  **优先级3: EN预测教师评价/成绩（data_source="teacher_rating"）**

  **识别特征**:
  - 列标签: "Report Card Grade", "ACES-M", "Teacher Rating"
  - 这类outcome通常样本量较小（如ACES-M可能只有部分教师返回）

  **提取要点**:
  - data_source: "teacher_rating"
  - **特别注意样本量**：在notes中标注实际n（如"n=38, teacher form return rate 62%"）

  ---

  **❌ 跳过: 同时测量的变量间相关**

  **识别特征**:
  - 表格标题: "Intercorrelations Among Predictors", "Descriptive Correlations"
  - 行列都是同一时间点的变量
  - 用于检查预测变量间的多重共线性

  **判断方法**:
  - 如果行列时间点相同（如都是"K winter"）→ ❌ 跳过
  - 这是concurrent validity，不是纵向预测

  ---

  ### 多时间点全量提取

  **如果表格覆盖多个T1和T2时间点**:
  1. 识别所有T1×T2配对
  2. 为每个配对创建独立记录
  3. timepoint_label格式: "T1_timepoint → T2_timepoint"
  4. 所有记录使用相同sample_id和is_dependent=True
  5. 在notes中记录表格位置和样本量来源

quality_rules:
  missing_penalties:
    cor: 0.30
    n: 0.20
    en_measure: 0.10
    math_measure: 0.10
  review_threshold: 0.7

extraction:
  mode: "full_context"
  max_input_chars: 500000
  truncation_marker: "\n\n[... 文档已截断 ...]\n"
