[project]
name = "metaagent-coding-sheet"
version = "0.1.0"
description = "Standalone coding sheet module (define template + LLM fill -> validated records -> Excel/CSV)."
authors = [{ name = "Hyoung Yan" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.2.3",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "pymupdf>=1.24.0",
    "pyyaml>=6.0.0",
]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["lib*"]
exclude = ["old*", "output*"]
