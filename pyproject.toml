[project]
name = "metaagent-epi"
version = "0.3.0"
description = "LLM-powered epidemiological systematic review automation"
readme = "readme.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Hyoung Yan" }]

dependencies = [
    "click>=8.0",
    "rich>=14.0",
    "pydantic>=2.0",
    "httpx>=0.24.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langgraph>=0.5.0",
    "matplotlib>=3.8.0",
    "openpyxl>=3.1.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0.0",
    "scipy>=1.10.0",
    "statsmodels==0.14.4",
    "tenacity>=8.0.0",
    "python-dotenv>=1.0.0",
    "beautifulsoup4>=4.13.0",
    "requests>=2.32.0",
    "numpy>=1.24.0",
    "pymupdf>=1.24.0",
    "cloudscraper>=1.2.71",
    "fake-useragent>=1.5.0",
    "termcolor>=2.0.0",
]

[project.optional-dependencies]
web = [
    "fastapi==0.136.3",
    "uvicorn==0.49.0",
    "starlette==1.2.1",
]
benchmark = [
    "rispy==0.10.0",
]
langextract = [
    "langextract>=1.7.1,<2",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
metaagent = "metaagent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["metaagent", "tools"]

[tool.ruff]
lint.select = ["E", "F", "I", "D", "UP"]
lint.ignore = ["UP006", "UP007", "UP035", "D417", "E501"]
lint.pydocstyle.convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
