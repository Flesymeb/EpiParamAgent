[project]
name = "metaagent-workbench-backend"
version = "0.1.0"
description = "Thin FastAPI layer for local MetaAgent-Epi workbench data access."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pandas>=2.3.1",
    "pydantic>=2.8.0",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"
