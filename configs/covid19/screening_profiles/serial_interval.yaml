topic: serial_interval
disease: covid19

defaults:
  thresholds:
    strong:
      disease_min: 4
      parameter_min: 4
      evidence_min: 3
      population_min: 2
      location_min: 2
    possible:
      disease_min: 3
      parameter_min: 2
      evidence_min: 3
      population_min: 2
      location_min: 2
  policies:
    title_abstract_mode: strict
    title_only_mode: lenient
    full_text_mode: standard
    stage2_evidence_floor: 2
    parameter_scoring_note: |
      - Use only the interval definitions allowed by the complete task: serial interval, generation interval/time, incubation period, and latent period are distinct.
      - Assess original interval estimates, including fitted models, under the stated study-design criteria. A parameter used only as a fixed input or background citation is not a new estimate.
      - At title/abstract screening, linked-case, exposure/onset, or interval-estimation evidence may justify full-text verification without an explicitly reported value; broad transmission context alone is insufficient.
      - At full text, check the target definition and data role. Raw timing data or secondary synthesis qualify only when the task permits that evidence form; do not substitute another interval or narrow a multi-parameter task.
    fulltext_rescue:
      enabled: true
      when_no_abstract: true

profiles:
  P10:
    project_number: 10
    research_question: What are the serial interval and generation interval/time estimates reported for SARS-CoV-2, including original strains and variants (e.g. Delta, Omicron)?
    disease_focus: COVID-19 or SARS-CoV-2 studies, including original wild-type strains, variants, lineages, or sublineages (e.g. Alpha, Delta, Omicron, BA.*).
    disease_exclude: none
    parameter_focus: studies that explicitly report, estimate, or compare serial interval, generation interval, or generation time for SARS-CoV-2 (any strain or variant); also include transmission-pair or household-contact studies where these parameters are a central implied outcome.
    parameter_exclude: studies on transmission dynamics, household transmission, outbreak investigation, incubation period, attack rate, or reproduction number that do not explicitly report or estimate serial interval, generation interval, or generation time.

  P11:
    project_number: 11
    research_question: What are the serial interval and generation time of SARS-CoV-2 estimated from contact tracing or household transmission studies?
    disease_focus: (COVID-19 OR SARS-CoV-2 OR 2019-nCoV OR "coronavirus disease 2019" OR "severe acute respiratory syndrome coronavirus 2")
    disease_exclude: none
    parameter_focus: (serial interval* OR generation time* OR generation interval*)
    parameter_exclude: studies that do not report or estimate serial interval or generation time

  P12:
    project_number: 12
    research_question: What are the serial interval and generation time of COVID-19?
    disease_focus: (COVID-19 OR SARS-CoV-2 OR novel coronavirus)
    disease_exclude: none
    parameter_focus: (serial interval OR generation time OR generation interval)
    parameter_exclude: studies that do not report or estimate serial interval or generation time

  P13:
    project_number: 13
    research_question: What serial interval and generation time evidence was reported or synthesized for COVID-19?
    disease_focus: (COVID-19 OR SARS-CoV-2 OR coronavirus OR 2019-nCoV OR SARS-CoV)
    disease_exclude: none
    parameter_focus: >-
      serial interval, generation interval, generation time, or serial
      distribution evidence reported by primary studies, modeling analyses,
      rapid or systematic reviews, and transmission studies in which an
      extractable timing estimate may be reported only in the full text
    parameter_exclude: studies with no plausible extractable serial-interval or generation-time evidence
    policies:
      parameter_scoring_note: |
        - This task allows primary studies, modeling analyses, and reviews that report or synthesize an extractable serial-interval or generation-time estimate.
        - Review status alone does not exclude an estimate under this task; do not extend that permission to tasks that exclude secondary evidence.
        - At title/abstract screening, relevant timing methods may warrant full-text verification; general transmission or clinical content alone is insufficient.
        - At full text, distinguish eligible estimates from background citations and fixed inputs, using the declared scope.

  P14:
    project_number: 14
    research_question: What is the serial interval of COVID-19?
    disease_focus: (COVID-19 OR 2019-nCoV OR coronavirus)
    disease_exclude: none
    parameter_focus: (serial interval)
    parameter_exclude: studies that do not report or estimate serial interval
