# Epidemiology codebook: case/infection fatality rate (CFR/IFR) extraction — mpox

topic: fatality

project:
  name: "Epi Codebook: Mpox Fatality Rate (CFR/IFR)"
  description: "Extract CFR and IFR estimates from primary mpox (monkeypox) epidemiological studies."
  effect_type: "fatality_rate"

stage_a:
  prompt_file: ../coding_prompts/stage_a_mpox_fatality.py

stage_b:
  prompt_file: ../coding_prompts/stage_b_mpox_fatality.py

parameters:
  research_question: >
    This project extracts case fatality rate (CFR) and infection fatality rate (IFR) estimates
    from primary mpox (monkeypox) epidemiological studies, along with study metadata and uncertainty.

notes: |
  Goal: extract fatality rate information FROM EACH PRIMARY STUDY on mpox/monkeypox.
  Preserve explicitly reported values and original units; normalization occurs in audited code.
  mpox CFR differs significantly by clade: West African clade (~1%), Congo Basin/clade I (~10%).
  Note the clade/strain when reported — this is CRITICAL for downstream stratified pooling.
  The 2022 global outbreak (clade IIb) has CFR <0.1% in non-endemic countries.
  Extract overall and explicitly reported age/severity subgroups as separate records.
  Record denominator_type carefully: confirmed cases vs estimated infections changes interpretation substantially.
  Extract explicitly reported deaths and their matched denominator even without a reported rate.
  Such a record is count_only: point_estimate and unreported uncertainty fields remain null.
  Do NOT calculate a fatality rate or CI from counts, infer missing counts, or combine distinct cohorts.
  Preserve the source case definition and its reported parameter label. CFR may
  refer to cases under the explicit source case definition; do not infer all cases
  are laboratory-confirmed. Keep hospital/ICU/IMV subtypes and denominators specific.
  IFR requires a total-infections denominator. Conflicting definitions stay pending.

fields:
  - name: pmid
    label: "PMID"
    type: str
    required: true
    prompt: "PubMed ID for the study."

  - name: study
    label: "Study"
    type: str
    required: true
    prompt: "Study identifier (author/year)."

  - name: region
    label: "Region"
    type: str
    required: true
    prompt: "Study location/region as reported."

  - name: estimation_period
    label: "Estimation_Period"
    type: str
    required: true
    prompt: "Estimation period or time window."

  - name: population
    label: "Population"
    type: str
    prompt: "Study population (general, hospitalized, endemic region, outbreak cohort, etc.)."

  - name: sample_size
    label: "Sample_Size"
    type: str
    prompt: "Number of cases or infections as reported."

  - name: parameter_type
    label: "Parameter_Type"
    type: str
    required: true
    prompt: "Preserve reported parameter meaning: CFR for cases under the stated source case definition, IFR for estimated total infections; other/NR when ambiguous. Keep endpoint subtype and denominator specific; never infer confirmation."

  - name: source_case_definition
    label: "Source_Case_Definition"
    type: str
    prompt: "Exact case definition reported by the source: laboratory-confirmed, probable, suspected, mixed, or unclear; never infer confirmation."

  - name: record_kind
    label: "Record_Kind"
    type: str
    required: true
    prompt: "rate_estimate if a fatality rate is explicitly reported; count_only if mortality counts are reported without a rate; NR otherwise."

  - name: deaths
    label: "Deaths"
    type: float
    review_range: [0, null]
    range: [0, null]
    prompt: "Explicitly reported number of deaths in this exact population, subgroup and time window; null if absent. Do not derive from percentages, sum rows, or infer zero from silence."

  - name: denominator_count
    label: "Denominator_Count"
    type: float
    review_range: [0, null]
    range: [0, null]
    prompt: "Explicitly reported denominator matched to these deaths/rate and follow-up window. It may be confirmed cases, estimated infections, hospitalizations, ICU admissions or IMV patients; label denominator_type. Never use a different cohort total or calculate a missing denominator."

  - name: confirmed_cases
    label: "Confirmed_Cases"
    type: float
    review_range: [0, null]
    range: [0, null]
    prompt: "Populate only when this record's denominator is explicitly confirmed cases, including explicitly confirmed-case subgroups. Do not rename estimated infections, unspecified patients, hospitalizations, ICU or IMV counts as confirmed cases without explicit confirmation; otherwise null."

  - name: clade
    label: "Clade"
    type: str
    prompt: "Mpox clade/strain if reported: clade_I | clade_Ia | clade_II | clade_IIa | clade_IIb | West_African | Congo_Basin | NR."

  - name: fatality_type
    label: "Fatality_Type"
    type: str
    required: true
    prompt: "CFR (source-defined cases) | IFR (estimated infections) | HFR (hospitalized) | ICU_fatality_rate | IMV_fatality_rate | other | NR. Preserve the specific endpoint even when parameter_type is CFR."

  - name: denominator_type
    label: "Denominator_Type"
    type: str
    required: true
    prompt: "confirmed_cases | estimated_infections | hospitalizations | ICU_admissions | IMV_patients | PCR_positive | other | NR."

  - name: summary_type
    label: "Summary_Type"
    type: str
    prompt: "How this value is reported: single_study | median | mean | pooled_mean | pooled_proportion | other."

  - name: age_group
    label: "Age_Group"
    type: str
    prompt: "all | child (<18) | adult (18-64) | elderly (65+) | specific range | NR."

  - name: severity_group
    label: "Severity_Group"
    type: str
    prompt: "all | mild | moderate | severe | critical | hospitalized | NR."

  - name: adjustment
    label: "Adjustment"
    type: str
    prompt: "none | age_standardized | ascertainment_corrected | statistical | bayesian | NR."

  - name: estimate_measure
    label: "Estimate_Measure"
    type: str
    required: true
    prompt: "proportion | percentage | rate | count_only | other. Use count_only when there is no explicitly reported rate."

  - name: point_estimate
    label: "Point_Estimate"
    type: float
    review_range: [0, null]
    prompt: "Explicitly reported fatality value in its original source unit. Null for count_only; never calculate deaths/denominator."

  - name: unit
    label: "Unit"
    type: str
    required: true
    prompt: "Original reported unit, e.g. percentage or proportion; NR for count_only."

  - name: uncertainty_type
    label: "Uncertainty_Type"
    type: str
    prompt: "CI | CrI | SE | Range | Other | NR."

  - name: uncertainty_level
    label: "Uncertainty_Level"
    type: str
    prompt: "95% | 90% | NR | Other."

  - name: uncertainty_low
    label: "Uncertainty_Low"
    type: float
    prompt: "Lower reported uncertainty bound in the original unit of point_estimate."

  - name: uncertainty_high
    label: "Uncertainty_High"
    type: float
    prompt: "Upper reported uncertainty bound in the original unit of point_estimate."

  - name: notes
    label: "Notes"
    type: str
    prompt: "Clade/strain info, subgroup estimates, methodological notes, evidence locations."

  - name: evidence_locations
    label: "Evidence_Locations"
    type: list[str]
    prompt: "1-3 evidence locations (e.g. 'Abstract', 'Table 2')."

index_schema:
  - name: region_raw
    path: study_meta.region_raw
  - name: period_raw
    path: study_meta.period_raw
  - name: fatality_type_raw
    path: study_meta.fatality_type_raw
  - name: clade_raw
    path: study_meta.clade_raw
  - name: summary_statistic
    path: analysis_summary.summary_statistic
  - name: pooling_method
    path: analysis_summary.pooling_method
  - name: denominator_type
    path: analysis_summary.denominator_type
  - name: adjustment
    path: analysis_summary.adjustment
  - name: processing_hint
    path: analysis_summary.processing_hint
  - name: period_raw
    path: study_meta.period_raw
  - name: population_raw
    path: study_meta.population_raw
  - name: sample_size_raw
    path: study_meta.sample_size_raw
  - name: fatality_type_hint
    path: field_evidence.fatality_type
  - name: estimate_hint
    path: field_evidence.point_estimate
  - name: deaths_hint
    path: field_evidence.deaths
  - name: denominator_count_hint
    path: field_evidence.denominator_count

quality_rules:
  missing_penalties:
    point_estimate: 0.3
  review_threshold: 0.7

extraction:
  mode: "full_context"
  max_input_chars: 500000
  truncation_marker: "\n\n[... document truncated ...]\n"
