# Epidemiology codebook: serial interval / generation interval extraction — mpox

project:
  name: "Epi Codebook: Mpox Serial Interval"
  description: "Extract study-level serial interval related estimates from primary mpox (monkeypox) studies."
  effect_type: "serial_interval"

stage_a:
  prompt_file: prompts/stage_a_serial_interval.py

stage_b:
  prompt_file: prompts/stage_b_serial_interval.py

parameters:
  research_question: >
    This project extracts study-level serial interval, generation interval, and incubation period
    evidence from primary epidemiological studies of mpox (monkeypox) transmission.
    The goal is to capture the main serial-interval-type estimate reported in each study,
    along with uncertainty and study metadata.

notes: |
  Goal: extract serial interval related information FROM EACH PRIMARY STUDY on mpox/monkeypox.
  Prefer the study's main serial interval estimate.
  If serial interval is not reported but generation interval/time or incubation period is central,
  capture it and mark parameter_type accordingly.
  mpox serial interval is typically longer than COVID-19 (7-14 days vs 4-7 days).
  Incubation period for mpox is also relevant (5-21 days) — capture if reported as primary result.
  Do NOT compute new estimates from raw counts.
  Keep uncertainty exactly as reported when possible.

fields:
  - name: pmid
    label: "PMID"
    type: str
    required: true
    prompt: "PubMed ID for the study."

  - name: study
    label: "Study"
    type: str
    required: true
    prompt: "Study identifier (author/year or short label)."

  - name: region
    label: "Region"
    type: str
    required: true
    prompt: "Study location/region/setting as reported."

  - name: estimation_period
    label: "Estimation_Period"
    type: str
    required: true
    prompt: "Estimation period or time window (raw text)."

  - name: population
    label: "Population"
    type: str
    prompt: "Study population or transmission-pair setting."

  - name: sample_size
    label: "Sample_Size"
    type: str
    prompt: "Sample size as reported (e.g., number of pairs/cases)."

  - name: method
    label: "Method"
    type: str
    required: true
    prompt: "Study method or estimation approach as reported."

  - name: parameter_type
    label: "Parameter_Type"
    type: str
    required: true
    prompt: "serial_interval|generation_interval|generation_time|incubation_period|other"

  - name: estimate_measure
    label: "Estimate_Measure"
    type: str
    required: true
    prompt: "mean|median|mode|other"

  - name: point_estimate
    label: "Point_Estimate"
    type: float
    prompt: "Main reported point estimate for the selected parameter."

  - name: unit
    label: "Unit"
    type: str
    required: true
    prompt: "Unit for the estimate, usually days."

  - name: uncertainty_type
    label: "Uncertainty_Type"
    type: str
    prompt: "CI|CrI|SD|IQR|Range|Other"

  - name: uncertainty_level
    label: "Uncertainty_Level"
    type: str
    prompt: "95%|90%|NR|Other"

  - name: uncertainty_low
    label: "Uncertainty_Low"
    type: float
    prompt: "Lower bound or lower uncertainty value if reported."

  - name: uncertainty_high
    label: "Uncertainty_High"
    type: float
    prompt: "Upper bound or upper uncertainty value if reported."

  - name: distribution
    label: "Distribution"
    type: str
    prompt: "Fitted distribution if reported (gamma, lognormal, Weibull, etc.)."

  - name: notes
    label: "Notes"
    type: str
    prompt: "Evidence location, alternative estimates, or clarification notes."

  - name: evidence_locations
    label: "Evidence_Locations"
    type: list[str]
    prompt: "1-3 evidence locations (e.g., 'Abstract', 'Table 1', 'Results paragraph 2')."

index_schema:
  - name: region_raw
    path: study_meta.region_raw
  - name: period_raw
    path: study_meta.period_raw
  - name: population_raw
    path: study_meta.population_raw
  - name: sample_size_raw
    path: study_meta.sample_size_raw
  - name: method_raw
    path: study_meta.method_raw
  - name: parameter_hint
    path: field_evidence.parameter_type
  - name: estimate_hint
    path: field_evidence.point_estimate
  - name: uncertainty_hint
    path: field_evidence.uncertainty

quality_rules:
  missing_penalties:
    point_estimate: 0.2
  review_threshold: 0.7

extraction:
  mode: "full_context"
  max_input_chars: 500000
  truncation_marker: "\n\n[... document truncated ...]\n"