# Stage A minimal schema (index defined in prompt)

project:
  name: "Stage A Index (Epidemiology)"
  description: "Parse paper structure and evidence locations for codebook-driven extraction."
  effect_type: "index"

prompt:
  prompt_file: ../prompts/stage_a.py

parameters:
  research_question: ""

fields:
  - name: study_id
    label: "Study_ID"
    type: str
    required: true
    prompt: "Study identifier (use PMID if available)."

  - name: index
    label: "Index"
    type: dict
    required: true
    prompt: "Structured index object (see Stage A prompt for required keys)."

quality_rules:
  missing_penalties: {}
  review_threshold: 0.7

extraction:
  mode: "full_context"
  max_input_chars: 500000
  truncation_marker: "\n\n[... document truncated ...]\n"
