topic: fatality
disease: mpox

defaults:
  thresholds:
    strong:
      disease_min: 4
      parameter_min: 4
      evidence_min: 3
      population_min: 2
      location_min: 2
    possible:
      disease_min: 3
      parameter_min: 2
      evidence_min: 2
      population_min: 2
      location_min: 2
  policies:
    title_abstract_mode: strict
    title_only_mode: lenient
    full_text_mode: standard
    stage2_evidence_floor: 1
    parameter_scoring_note: |
      - Score 3–4 if the paper directly reports case fatality rate, infection fatality
        rate, or mortality rate from its own original patient/surveillance data (e.g.
        a cohort study, surveillance report, or meta-analysis that calculates CFR).
      - Score 2 if the paper reports a clinical case series or case report that records
        patient outcomes (survived/died), even without explicitly calculating CFR, OR
        if it is an epidemiological report documenting deaths during an mpox outbreak.
        Individual case reports of imported mpox with outcome data should score 2.
      - Score 1 if the paper only mentions mortality in the background/introduction
        without contributing new outcome data.
      - Score 0 if death/fatality is not discussed at all.
    fulltext_rescue:
      enabled: true
      when_no_abstract: true

profiles:
  MP4:
    project_number: 4
    research_question: What is the case fatality rate (CFR) of mpox?
    disease_focus: mpox or monkeypox or MPXV
    disease_exclude: none
    parameter_focus: case fatality rate OR CFR OR mortality rate OR infection fatality rate OR IFR
    parameter_exclude: studies that do not report fatality or mortality rate

  MP7:
    project_number: 7
    research_question: What is the mortality/fatality of mpox?
    disease_focus: mpox or monkeypox or MPXV
    disease_exclude: none
    parameter_focus: mortality OR fatality OR case fatality rate OR death rate
    parameter_exclude: none

  MP8:
    project_number: 8
    research_question: What is the case fatality rate of mpox?
    disease_focus: mpox or monkeypox or MPXV
    disease_exclude: none
    parameter_focus: case fatality rate OR CFR OR fatality rate
    parameter_exclude: studies that do not report case fatality rate

  MP12:
    project_number: 12
    research_question: What is the CFR of mpox?
    disease_focus: mpox or monkeypox or MPXV
    disease_exclude: none
    parameter_focus: case fatality rate OR CFR OR mortality
    parameter_exclude: studies that do not report fatality rate
