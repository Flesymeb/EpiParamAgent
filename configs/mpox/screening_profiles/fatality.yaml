topic: fatality
disease: mpox

defaults:
  thresholds:
    strong:
      disease_min: 4
      parameter_min: 4
      evidence_min: 3
      population_min: 2
      location_min: 2
    possible:
      disease_min: 3
      parameter_min: 2
      evidence_min: 3
      population_min: 2
      location_min: 2
  policies:
    title_abstract_mode: strict
    title_only_mode: lenient
    full_text_mode: standard
    stage2_evidence_floor: 1
    parameter_scoring_note: |
      CFR screening guidance:
      - Judge whether the paper could contribute extractable CFR/fatality/mortality
        information from original human mpox patient, outbreak, clinical, cohort,
        case-series, or surveillance data.
      - Strong support: the title/abstract directly reports CFR/IFR, fatality,
        mortality, deaths, no deaths, no fatal outcomes, or deaths with a patient
        denominator.
      - Moderate support: the paper reports original human mpox cases with clinical
        course, outcomes, severity, admissions, or surveillance summaries where
        fatality data may plausibly appear in full text or tables.
      - For imported-case reports, traveler case reports, household/family clusters,
        hospital outbreak reports, and environmental investigations tied to named
        human cases, do not require the abstract to explicitly say "death" or
        "outcome". If the article is original human case evidence and the clinical
        course/outcome could plausibly be extractable in full text, use P rather
        than U.
      - For source-review recall, sparse older human monkeypox reports and
        case-focused papers can be P when they plausibly contain patient outcome
        or denominator information in the full text, even if the title/abstract
        emphasizes importation, diagnosis, transmission, sample testing, or
        environmental investigation.
      - For mpox fatality source-review recall, do not exclude human case reports,
        clinical sample studies, viral shedding studies, saliva/semen PCR or virus
        isolation studies, imported-case investigations, domestic/environmental
        contamination investigations tied to named human cases, or unusual death
        reports solely because the title/abstract does not mention CFR or death.
        These records may still contain patient outcome and denominator details
        in case descriptions or tables; classify as P unless they are clearly
        animal-only, laboratory-only without human cases, policy/commentary, or
        unrelated to confirmed/suspected human mpox cases.
      - A recovered case, no fatal outcomes, or a case series with zero deaths can
        contribute a 0% fatality estimate when a denominator is clear.
      - Weak support: the paper has little connection to patient outcomes or lacks
        original human case data. Weigh this against any other evidence rather than
        applying a keyword-only exclusion.
      - Assign S/P/U after weighing supporting and opposing reasons; do not decide
        solely from title keywords.
    fulltext_rescue:
      enabled: true
      when_no_abstract: true

profiles:
  MP4:
    project_number: 4
    research_question: What is the case fatality rate (CFR) of mpox?
    disease_focus: mpox or monkeypox or MPXV
    disease_exclude: none
    parameter_focus: case fatality rate OR CFR OR mortality rate OR infection fatality rate OR IFR
    parameter_exclude: studies that do not report fatality or mortality rate

  MP7:
    project_number: 7
    research_question: What is the mortality/fatality of mpox?
    disease_focus: mpox or monkeypox or MPXV
    disease_exclude: none
    parameter_focus: mortality OR fatality OR case fatality rate OR death rate
    parameter_exclude: studies with little plausible connection to extractable mpox CFR, mortality, fatality, or patient outcome data

  MP8:
    project_number: 8
    research_question: What is the case fatality rate of mpox, restricted to records created on or before 2023-03-20?
    disease_focus: mpox or monkeypox or MPXV
    disease_exclude: none
    parameter_focus: case fatality rate, CFR, fatality rate, mortality, deaths, death rate, fatal outcomes, no deaths, survival/death status, or mortality among mpox cases
    parameter_exclude: studies created after 2023-03-20 or studies with little plausible connection to extractable mpox CFR, mortality, fatality, or patient outcome data

  MP12:
    project_number: 12
    research_question: What is the CFR of mpox?
    disease_focus: mpox or monkeypox or MPXV
    disease_exclude: none
    parameter_focus: case fatality rate OR CFR OR mortality
    parameter_exclude: studies that do not report fatality rate
