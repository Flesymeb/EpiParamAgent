topic: reproduction_number
disease: mpox

defaults:
  thresholds:
    strong:
      disease_min: 4
      parameter_min: 4
      evidence_min: 3
      population_min: 2
      location_min: 2
    possible:
      disease_min: 3
      parameter_min: 3
      evidence_min: 2
      population_min: 2
      location_min: 2
  policies:
    title_abstract_mode: strict
    title_only_mode: lenient
    full_text_mode: standard
    stage2_evidence_floor: 1
    parameter_scoring_note: |
      - Distinguish R0, Rt, and Re and apply the task's target definition. An epidemic growth rate or doubling time is not itself a reproduction-number estimate.
      - Original models fitted to aggregate incidence, surveillance, contact, or genomic data can estimate the target; lack of individual-level data alone does not make them ineligible.
      - Distinguish a model's estimated output from a cited value or fixed input. At title/abstract screening, a task-supported estimation path may remain unresolved without an explicit R0/Rt/Re value; generic modeling or transmission language alone is insufficient.
      - At full text, verify an eligible reported estimate. Re-analysis of raw data or secondary synthesis is acceptable only when the task explicitly permits that evidence form.
    fulltext_rescue:
      enabled: true
      when_no_abstract: true

profiles:
  MP9:
    project_number: 9
    research_question: What are the R0/Rt/Re estimates for human mpox outbreaks, restricted to records created on or before 2023-02-09?
    disease_focus: mpox or monkeypox or MPXV
    disease_exclude: none
    parameter_focus: numeric R0, Rt, Re, effective reproduction number, instantaneous reproduction number, or reproductive number estimate for human mpox
    parameter_exclude: studies created after 2023-02-09 or studies with little plausible connection to extractable reproduction-number estimates from human mpox outbreak data
