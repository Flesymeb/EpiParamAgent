topic: serial_interval
disease: mpox

defaults:
  thresholds:
    strong:
      disease_min: 4
      parameter_min: 4
      evidence_min: 3
      population_min: 2
      location_min: 2
    possible:
      disease_min: 3
      parameter_min: 2
      evidence_min: 2
      population_min: 2
      location_min: 2
  policies:
    title_abstract_mode: strict
    title_only_mode: lenient
    full_text_mode: standard
    stage2_evidence_floor: 2
    parameter_scoring_note: |
      Serial interval / generation time screening guidance:
      - Judge whether the paper could contribute extractable serial interval,
        generation interval/time, or incubation-period estimates from human mpox
        cases, contact tracing, outbreak data, or modeling.
      - Strong support: the title/abstract directly reports or clearly estimates
        the target parameter from the paper's own data or analysis.
      - Moderate support: the paper has original contact-tracing, exposure-to-onset,
        symptom-onset date, infector-infectee pair, or quantitative timing evidence
        where serial interval, generation time, or incubation period may plausibly
        appear in full text or tables.
      - Do not mark a paper as P solely because it is about clinical features,
        surveillance, viral shedding, post-exposure vaccination, general outbreak
        description, or transmission context. If it lacks exposure/onset timing,
        contact-pair data, or an explicit interval estimate, usually mark U.
      - Modeling papers should be P or S only when they estimate or use timing
        intervals as study outputs or calibrated quantities, not merely because
        they model mpox transmission.
      - For source-review recall, older human monkeypox reviews or broad
        outbreak reports can be P when they plausibly summarize incubation
        period, exposure-to-onset timing, or transmission timing evidence used by
        the source review. Treat these as full-text verification candidates, not
        strong title/abstract inclusions.
      - Do not require the title/abstract to explicitly say "serial interval" or
        "incubation period" for original outbreak investigations that include
        exposure interviews, active contact surveillance, occupational exposure,
        household/family transmission, or named linked cases. These records may
        contain exposure-to-onset or contact-timing data in full text; classify
        them as P unless they are clearly unrelated to human transmission timing.
      - For older mpox source-review references, a narrative review focused on
        human monkeypox clinical disease, epidemiology, and research can be P
        because it may summarize incubation-period evidence used by the source
        review. Score evidence low, but do not make it an automatic U when the
        disease and epidemiology scope match the source-review question.
      - Weak support: the paper has little connection to timing or transmission
        interval estimation. Weigh this against any other evidence rather than
        applying a keyword-only exclusion.
      - Assign S/P/U after weighing supporting and opposing reasons; do not decide
        solely from title keywords.
    fulltext_rescue:
      enabled: true
      when_no_abstract: true

profiles:
  MP5:
    project_number: 5
    research_question: What are the serial intervals, generation times, and incubation periods of mpox?
    disease_focus: mpox or monkeypox or MPXV
    disease_exclude: none
    parameter_focus: serial interval or generation interval or incubation period
    parameter_exclude: studies with little plausible connection to extractable serial interval, generation time, or incubation-period estimates

  MP6:
    project_number: 6
    research_question: What are the serial intervals and incubation period of mpox?
    disease_focus: mpox or monkeypox or MPXV
    disease_exclude: none
    parameter_focus: serial interval or incubation period or latent period
    parameter_exclude: studies with little plausible connection to extractable serial interval or incubation-period estimates

  MP10:
    project_number: 10
    research_question: What are the serial intervals, generation time, and R0/Rt of mpox?
    disease_focus: mpox or monkeypox or MPXV
    disease_exclude: none
    parameter_focus: serial interval or generation time or reproduction number or R0
    parameter_exclude: none

  MP11:
    project_number: 11
    research_question: What are the serial intervals and incubation periods of mpox?
    disease_focus: mpox or monkeypox or MPXV
    disease_exclude: none
    parameter_focus: serial interval or incubation period
    parameter_exclude: studies with little plausible connection to extractable serial interval or incubation-period estimates
