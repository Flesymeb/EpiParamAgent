topic: serial_interval
disease: mpox

defaults:
  thresholds:
    strong:
      disease_min: 4
      parameter_min: 4
      evidence_min: 3
      population_min: 2
      location_min: 2
    possible:
      disease_min: 3
      parameter_min: 2
      evidence_min: 2
      population_min: 2
      location_min: 2
  policies:
    title_abstract_mode: strict
    title_only_mode: lenient
    full_text_mode: standard
    stage2_evidence_floor: 2
    parameter_scoring_note: |
      - Use only the interval definitions allowed by the complete task: serial interval, generation interval/time, incubation period, and latent period are distinct.
      - Assess original interval estimates, including fitted models, under the stated study-design criteria. A parameter used only as a fixed input or background citation is not a new estimate.
      - At title/abstract screening, linked-case, exposure/onset, or interval-estimation evidence may justify full-text verification without an explicitly reported value; broad transmission context alone is insufficient.
      - At full text, check the target definition and data role. Raw timing data or secondary synthesis qualify only when the task permits that evidence form; do not substitute another interval or narrow a multi-parameter task.
    fulltext_rescue:
      enabled: true
      when_no_abstract: true

profiles:
  MP5:
    project_number: 5
    research_question: What are the serial intervals, generation times, and incubation periods of mpox?
    disease_focus: mpox or monkeypox or MPXV
    disease_exclude: none
    parameter_focus: serial interval or generation interval or incubation period
    parameter_exclude: studies with little plausible connection to extractable serial interval, generation time, or incubation-period estimates

  MP6:
    project_number: 6
    research_question: What are the serial intervals and incubation period of mpox?
    disease_focus: mpox or monkeypox or MPXV
    disease_exclude: none
    parameter_focus: serial interval or incubation period or latent period
    parameter_exclude: studies with little plausible connection to extractable serial interval or incubation-period estimates

  MP10:
    project_number: 10
    research_question: What are the serial intervals, generation time, and R0/Rt of mpox?
    disease_focus: mpox or monkeypox or MPXV
    disease_exclude: none
    parameter_focus: serial interval or generation time or reproduction number or R0
    parameter_exclude: none

  MP11:
    project_number: 11
    research_question: What are the serial intervals and incubation periods of mpox?
    disease_focus: mpox or monkeypox or MPXV
    disease_exclude: none
    parameter_focus: serial interval or incubation period
    parameter_exclude: studies with little plausible connection to extractable serial interval or incubation-period estimates
