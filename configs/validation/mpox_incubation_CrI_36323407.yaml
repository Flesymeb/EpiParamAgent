    credible interval type. If text and tables conflict, preserve the conflicting
    source-supported records and mark the unresolved discrepancy; never silently decide
    which original value is true.
review_protocol:
  version: development-scope-v1
  criteria:
  - id: disease
    description: Original human mpox study
  - id: outcome
    description: Reports incubation period estimates
  logic:
    all:
    - disease
    - outcome
search: {}
analysis_protocol:
  analysis_id: mpox_incubation_CrI_36323407-analysis
  parameter_type: incubation_period
  estimate_measure: mean
  unit: days
  method: fixed
  independence:
    unit: record_id
    assert_independent_reports: true
    multiple_estimates: review
  minimum_estimates: 1
  llm_report: false
  uncertainty_rules:
    allowed_types:
    - CI
    - SE
    - SD
