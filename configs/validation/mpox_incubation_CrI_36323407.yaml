version: '1'
task_id: mpox_incubation_CrI_36323407
disease: mpox
topic: incubation_period
research_question: What mean incubation period is reported in the declared primary
  report?
codebook: codebooks/incubation_period.yaml
coding:
  backend: langextract
  chunk_chars: 24000
  stage_a_empty_retries: 1
  extraction_scope: Incubation-period mean estimated using the interval-censored corrected
    (ICC) model in the overall primary analysis. Distinguish it from ICRTC, medians,
