# Epidemiology Literature Search Configuration

# Domain-specific settings for epidemiology research
domain:
  name: "epidemiology"
  subdomains:
    - "infectious_disease"
    - "chronic_disease"
    - "environmental_epi"
    - "occupational_epi"
    - "genetic_epi"
    - "social_epi"
    - "cancer_epi"
    - "cardiovascular_epi"
    - "nutritional_epi"

  # Study design types prioritized for epidemiology
  study_designs:
    - "cohort"
    - "case_control"
    - "cross_sectional"
    - "randomized_controlled_trial"
    - "ecological"
    - "meta_analysis"
    - "systematic_review"

  # Keyword categories specific to epidemiology
  keyword_categories:
    exposure_terms:
      - "environmental exposure"
      - "occupational hazard"
      - "behavioral risk factor"
      - "genetic variant"
    outcome_terms:
      - "disease incidence"
      - "prevalence"
      - "mortality"
      - "morbidity"
      - "health outcome"
    measurement_terms:
      - "diagnostic criteria"
      - "biomarker"
      - "exposure assessment"
      - "laboratory test"
      - "clinical diagnosis"

agent:
  max_iterations: 10
  search_depth: 2
  papers_per_query: 20
  temperature: 0.7
  max_tokens: 2048

search:
  default_source: "pubmed" # pubmed, embase, both
  max_results: 20
  date_range_years: 10 # Epidemiology often uses longer time ranges

retrieval:
  chunk_size: 512
  chunk_overlap: 50
  top_k: 10
  rerank: true
  similarity_threshold: 0.7

llm:
  provider: "claude" # claude, openai, local
  model: "claude-3-5-sonnet-20241022"
  temperature: 0.7
  max_tokens: 4096
  stream: true

storage:
  data_dir: "./data"
  papers_dir: "./data/papers"
  metadata_dir: "./data/metadata"

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "./logs/research_pilot.log"
